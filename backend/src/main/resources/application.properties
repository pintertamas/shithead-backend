spring.application.name=shithead-backend
server.port=8080

# Lambda request payloads can contain Authorization bearer tokens.
logging.level.org.springframework.cloud.function.adapter.aws.AWSLambdaUtils=WARN

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/

# AWS Configuration
aws.region=${AWS_REGION}

# DynamoDB Table Name Configuration
dynamodb.sessions.table=${GAME_SESSIONS_TABLE:shithead-game-sessions}
dynamodb.users.table=${USERS_TABLE:shithead-users}

# WebSocket connection registry used when blocking users (empty when not configured)
ws.connections.table=${WS_CONNECTIONS_TABLE:}
ws.management.endpoint=${WS_MANAGEMENT_ENDPOINT:}
